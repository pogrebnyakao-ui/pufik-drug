apply plugin: 'com.android.application'

// Version comes from package.json "version" (X.Y.Z): versionName "X.Y.Z",
// versionCode X*10000 + Y*100 + Z (1.0.0 -> 10000). Bump it for every RuStore upload.
def pufikVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String
def pufikVersionMatch = pufikVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!pufikVersionMatch.matches()) {
    throw new GradleException("package.json \"version\" must look like 1.2.3, found \"${pufikVersion}\"")
}
def (pufikMajor, pufikMinor, pufikPatch) = (1..3).collect { pufikVersionMatch.group(it) as int }
if (pufikMinor > 99 || pufikPatch > 99) {
    throw new GradleException("package.json version ${pufikVersion}: minor and patch must be 0..99")
}
def pufikVersionCode = pufikMajor * 10000 + pufikMinor * 100 + pufikPatch

// Release signing from environment variables (GitHub Actions sets them from repository secrets).
// None set: release builds stay unsigned. Only some set: fail, that is always a mistake.
def pufikSigningVars = ['PUFIK_KEYSTORE_FILE', 'PUFIK_KEYSTORE_PASSWORD', 'PUFIK_KEY_ALIAS', 'PUFIK_KEY_PASSWORD']
def pufikSigningMissing = pufikSigningVars.findAll { !System.getenv(it) }
def pufikSigning = pufikSigningMissing.isEmpty()
if (!pufikSigning && pufikSigningMissing.size() < pufikSigningVars.size()) {
    throw new GradleException("Release signing needs all of ${pufikSigningVars.join(', ')}; missing: ${pufikSigningMissing.join(', ')}")
}

android {
    namespace = "ru.artem.pufik"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.artem.pufik"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pufikVersionCode
        versionName pufikVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (pufikSigning) {
        signingConfigs {
            release {
                storeFile file(System.getenv('PUFIK_KEYSTORE_FILE'))
                storePassword System.getenv('PUFIK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PUFIK_KEY_ALIAS')
                keyPassword System.getenv('PUFIK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (pufikSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Used directly by MainActivity (insets, immersive mode, back callback); same versions as Capacitor.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
