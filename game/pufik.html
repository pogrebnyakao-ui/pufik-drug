<title>Пуфик</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffe9c7">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
  /* Layout: full-screen game canvas; start card, parent menu and debug panel are DOM overlays. Single bright look by choice. */
  :root {
    --bg-top: #fff4c9;
    --bg-bottom: #ffd9a8;
    --ink: #5a3a1e;
    --btn: #ff8a4c;
    --btn-shadow: #c9622e;
    --card: #ffffffee;
    --soft: #fff6ea;
    --line: #f0dcc4;
    --font: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body {
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .start {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
    background: #fff4e055;
  }
  .card {
    position: relative;
    background: var(--card); border-radius: 36px; padding: 34px 30px 26px;
    text-align: center; max-width: 480px; width: 100%; box-shadow: 0 20px 60px #0003;
    display: grid; gap: 16px;
  }
  .card h1 { margin: 0; font-size: clamp(40px, 9vw, 64px); font-weight: 900; line-height: 1.05; text-wrap: balance; }
  .card p { margin: 0; font-size: 19px; font-weight: 800; opacity: .75; text-wrap: balance; }
  .play {
    font: inherit; font-size: 40px; font-weight: 900;
    background: var(--btn); color: #fff; border: none; border-radius: 999px;
    padding: 20px 56px; cursor: pointer; box-shadow: 0 8px 0 var(--btn-shadow); justify-self: center;
  }
  .play:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--btn-shadow); }
  .play:focus-visible, .gear:focus-visible, .exit:focus-visible { outline: 5px solid var(--ink); outline-offset: 4px; }
  .hint { font-size: 14px !important; opacity: .5 !important; }
  .gear {
    position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%;
    border: none; background: transparent; font-size: 22px; cursor: pointer; opacity: .45; padding: 0;
    touch-action: none;
  }
  .gear svg { position: absolute; inset: 0; transform: rotate(-90deg); pointer-events: none; }
  .gear circle { fill: none; stroke: var(--btn); stroke-width: 4; stroke-dasharray: 126; stroke-dashoffset: 126; }
  .gear.holding { opacity: 1; }
  .gear.holding circle { transition: stroke-dashoffset 3s linear; stroke-dashoffset: 0; }
  .exit {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top, 0px));
    right: calc(8px + env(safe-area-inset-right, 0px));
    font: inherit; font-size: 13px; font-weight: 800;
    background: #ffffffaa; color: var(--ink); border: none; border-radius: 999px; padding: 7px 11px; cursor: pointer;
  }

  /* parent menu: ordinary readable form, this is for grown-ups */
  .parent {
    position: fixed; inset: 0; background: #3a2a1a88; display: grid; place-items: center;
    padding: 16px; touch-action: auto; user-select: text; -webkit-user-select: text;
  }
  .sheet {
    background: #fff; border-radius: 24px; width: min(560px, 100%); max-height: calc(100dvh - 32px);
    overflow: auto; padding: 22px 20px; box-shadow: 0 20px 60px #0004; overscroll-behavior: contain; touch-action: pan-y;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; }
  .sheet h3 { margin: 22px 0 8px; font-size: 18px; font-weight: 900; }
  .sheet p, .sheet label, .sheet td, .sheet th { font-size: 16px; font-weight: 700; }
  .sheet .muted { opacity: .6; font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .row > span { font-weight: 800; }
  .sheet input, .sheet select, .sheet button, .sheet textarea { font: inherit; font-size: 16px; color: var(--ink); }
  .sheet input[type=text], .sheet input[type=time], .sheet select, .sheet textarea {
    border: 2px solid var(--line); border-radius: 12px; padding: 7px 10px; background: var(--soft);
  }
  .sheet textarea { width: 100%; min-height: 84px; font-size: 13px; word-break: break-all; }
  .sheet input[type=range] { width: 160px; accent-color: var(--btn); }
  .sheet input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--btn); }
  .btn { border: none; border-radius: 999px; padding: 10px 18px; background: var(--soft); font-weight: 800; cursor: pointer; border: 2px solid var(--line); }
  .btn.main { background: var(--btn); color: #fff; border-color: var(--btn); }
  .btn.danger { background: #fff0ee; border-color: #f3b7ae; color: #a8402f; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .swatches { display: flex; gap: 10px; }
  .swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; }
  .swatch[aria-pressed=true] { box-shadow: 0 0 0 3px var(--ink); }
  .stats { width: 100%; border-collapse: collapse; }
  .stats th, .stats td { text-align: center; padding: 5px 2px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .stats th:first-child, .stats td:first-child { text-align: left; }
  .gate { text-align: center; display: grid; gap: 12px; }
  .gate .sum { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; justify-content: center; }
  .keys button { height: 60px; border-radius: 16px; border: 2px solid var(--line); background: var(--soft); font: inherit; font-size: 26px; font-weight: 900; cursor: pointer; color: var(--ink); }
  .debug {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 4px; z-index: 5;
    background: #000b; color: #fff; font: 12px/1.3 ui-monospace, monospace; padding: 6px 8px; border-radius: 10px;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: 96vw; touch-action: auto;
  }
  .debug button { font: inherit; padding: 4px 7px; border-radius: 6px; border: none; cursor: pointer; }
</style>

<canvas id="field"></canvas>
<button class="exit" id="menu" hidden>Меню</button>
<div class="start" id="start">
  <div class="card">
    <button class="gear" id="gear" aria-label="Для родителей: удерживайте 3 секунды"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/></svg>⚙️</button>
    <h1 id="title">Пуфик</h1>
    <p id="subtitle">Твой пушистый друг ждёт тебя!</p>
    <button class="play" id="play">Играть</button>
    <p class="hint">Игра откроется на весь экран. Выйти можно кнопкой «Меню» или клавишей Esc. Шестерёнка для родителей: удерживайте её 3 секунды.</p>
  </div>
</div>
<div class="parent" id="parent" hidden><div class="sheet" id="sheet"></div></div>
<div class="debug" id="debug" hidden></div>
<script>
// Shared bits, as in the other games: canvas sizing, synthesized sounds, particles, start/menu, pointer routing.
const K = (() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const startEl = document.getElementById('start');
  const menuBtn = document.getElementById('menu');
  const K = {
    canvas, ctx, W: 0, H: 0, playing: false, multi: false,
    app: !!window.PUFIK_APP, paused: false, // the Android app (it keeps the screen full and on itself); paused by it
    reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
    EMOJI: '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif',
    FONT: 'Nunito, "Trebuchet MS", sans-serif',
    onResize() {}, onFrame() {}, onStart() {}, onStop() {}, onDown() {}, onMove() {}, onUp() {},
  };
  if (K.app) startEl.querySelector('.hint').textContent = 'Выйти можно кнопкой «Меню». Шестерёнка для родителей: удерживайте её 3 секунды.';
  K.TAU = Math.PI * 2;
  K.rand = (a, b) => a + Math.random() * (b - a);
  K.pick = arr => arr[Math.floor(Math.random() * arr.length)];
  K.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.ease = k => 1 - Math.pow(1 - K.clamp(k, 0, 1), 3);
  K.easeInOut = k => 0.5 - 0.5 * Math.cos(Math.PI * K.clamp(k, 0, 1));
  K.back = k => { k = K.clamp(k, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
  K.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    K.W = innerWidth; K.H = innerHeight;
    canvas.width = Math.round(K.W * dpr); canvas.height = Math.round(K.H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    K.onResize();
  }
  addEventListener('resize', resize);
  K.init = resize;

  // --- sound: everything is synthesized, no files ---
  let ac = null, master = null, music = null, noiseBuf = null;
  const A = K.audio = { vol: 0.7, mus: 0.5, quiet: 1 };
  A.init = () => {
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.connect(ac.destination);
        music = ac.createGain(); music.connect(master);
        const n = ac.sampleRate * 2;
        noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      }
      ac.resume();
      A.apply();
    } catch (e) { ac = null; }
  };
  A.apply = () => {
    if (!ac) return;
    master.gain.setTargetAtTime(A.vol * A.quiet, ac.currentTime, 0.05);
    music.gain.setTargetAtTime(A.mus, ac.currentTime, 0.05);
  };
  A.now = () => ac ? ac.currentTime : 0;
  A.ok = () => !!ac;
  // the page or the app went away: sound stops at once and comes back with the game (failures are ignored)
  A.sleep = () => { try { if (ac && ac.state !== 'closed') ac.suspend().catch(() => {}); } catch (e) {} };
  A.wake = () => { try { if (ac && ac.state !== 'closed') ac.resume().catch(() => {}); } catch (e) {} };
  function env(g, t, vol, att, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  A.tone = (f, at, dur, type, vol, f2, toMusic) => {
    if (!ac) return null;
    const t = ac.currentTime + (at || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(g, t, vol || 0.25, 0.012, dur);
    o.connect(g).connect(toMusic ? music : master); o.start(t); o.stop(t + dur + 0.05);
    return o;
  };
  A.noise = (at, dur, ftype, freq, vol, q, toMusic) => {
    if (!ac) return null;
    const t = ac.currentTime + (at || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true; s.loopStart = Math.random();
    f.type = ftype || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    env(g, t, vol || 0.2, 0.008, dur);
    s.connect(f).connect(g).connect(toMusic ? music : master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
    return { s, f, g, t };
  };
  // a noise that holds steady (shower water)
  A.hold = (dur, ftype, freq, vol) => {
    if (!ac) return;
    const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true;
    f.type = ftype; f.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.15);
    g.gain.setValueAtTime(vol, t + dur - 0.3); g.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.05);
  };
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  A.midi = midi;
  A.melody = (notes, beat, opts) => {
    // notes: [midi or 0 for rest, beats]
    opts = opts || {};
    let at = opts.at || 0;
    for (const [m, b] of notes) {
      if (m) A.tone(midi(m), at, b * beat * 0.95, opts.type || 'triangle', opts.vol || 0.18, null, opts.music);
      at += b * beat;
    }
    return at;
  };

  const S = K.sfx = {
    pim() { A.tone(600, 0, 0.08, 'sine', 0.25, 900); },
    giggle() {
      if (!ac) return;
      for (let i = 0; i < 3; i++) {
        const t = ac.currentTime + i * 0.11, o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
        o.type = 'triangle'; o.frequency.value = 800 - i * 40;
        l.frequency.value = 28; lg.gain.value = 40; l.connect(lg).connect(o.frequency);
        env(g, t, 0.18, 0.01, 0.09);
        o.connect(g).connect(master); o.start(t); l.start(t); o.stop(t + 0.12); l.stop(t + 0.12);
      }
    },
    laugh() { S.giggle(); setTimeout(S.giggle, 380); setTimeout(S.giggle, 760); },
    purr(dur) {
      if (!ac) return;
      dur = dur || 1.4;
      const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), am = ac.createGain(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
      s.buffer = noiseBuf; s.loop = true; f.type = 'lowpass'; f.frequency.value = 200; f.Q.value = 2;
      am.gain.value = 0.5; l.frequency.value = 25; lg.gain.value = 0.5; l.connect(lg).connect(am.gain);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.9, t + 0.2); g.gain.setValueAtTime(0.9, t + dur - 0.3); g.gain.linearRampToValueAtTime(0, t + dur);
      s.connect(f).connect(am).connect(g).connect(master); s.start(t); l.start(t); s.stop(t + dur + 0.05); l.stop(t + dur + 0.05);
    },
    chew() { for (let i = 0; i < 4; i++) A.noise(i * 0.34, 0.12, 'bandpass', 900 + Math.random() * 500, 0.22, 3); },
    crunch() { A.noise(0, 0.08, 'highpass', 2500, 0.25); A.noise(0.1, 0.07, 'highpass', 3000, 0.2); },
    yum() { A.tone(420, 0, 0.18, 'sine', 0.2, 520); A.tone(520, 0.2, 0.3, 'sine', 0.2, 700); },
    yawn() {
      if (!ac) return;
      const t = ac.currentTime, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.8);
      f.type = 'lowpass'; f.frequency.value = 900;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
      o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.9);
    },
    water(d) { A.hold(d || 3, 'highpass', 1800, 0.12); },
    bloop() { A.tone(400, 0, 0.06, 'sine', 0.2, 1200); },
    pop(i) { A.tone(500 + (i || 0) * 60, 0, 0.07, 'sine', 0.25, 1500 + (i || 0) * 80); },
    quack() {
      if (!ac) return;
      for (let i = 0; i < 2; i++) {
        const t = ac.currentTime + i * 0.17, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
        o.type = 'square'; o.frequency.setValueAtTime(500, t); o.frequency.linearRampToValueAtTime(420, t + 0.12);
        f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 3;
        env(g, t, 0.3, 0.01, 0.12); o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.15);
      }
    },
    wish() { [523, 659, 784].forEach((f, i) => A.tone(f, i * 0.1, 0.3, 'triangle', 0.25)); },
    fanfare() {
      [523, 659, 784, 659, 1047].forEach((f, i) => A.tone(f, i * 0.14, i === 4 ? 0.8 : 0.22, 'triangle', 0.28));
      for (let i = 0; i < 6; i++) A.tone(K.rand(2000, 3200), 0.75 + i * 0.07, 0.15, 'sine', 0.06);
    },
    oops() { A.tone(330, 0, 0.16, 'sine', 0.2); A.tone(262, 0.14, 0.26, 'sine', 0.2); },
    gulp() { A.tone(220, 0, 0.1, 'sine', 0.25, 140); A.tone(220, 0.25, 0.1, 'sine', 0.25, 140); },
    tick() { A.tone(K.rand(1400, 2200), 0, 0.05, 'sine', 0.05); },
    tock() { A.noise(0, 0.06, 'bandpass', 700, 0.35, 4); A.tone(300, 0, 0.06, 'sine', 0.15, 200); },
    whoosh() { A.noise(0, 0.3, 'bandpass', 900, 0.08, 0.8); },
    boing() { A.tone(180, 0, 0.25, 'sine', 0.3, 420); },
    kuku() { A.tone(784, 0, 0.18, 'sine', 0.25); A.tone(622, 0.22, 0.3, 'sine', 0.25); },
    step() { A.noise(0, 0.05, 'lowpass', 500, 0.3); A.noise(0.16, 0.05, 'lowpass', 450, 0.25); },
    rustle() { A.noise(0, 0.25, 'highpass', 3500, 0.08); },
    sneeze() { A.tone(500, 0, 0.25, 'sine', 0.12, 700); A.noise(0.35, 0.18, 'bandpass', 2500, 0.3, 0.7); },
    smack() { A.noise(0, 0.03, 'bandpass', 1800, 0.15, 5); A.noise(0.12, 0.03, 'bandpass', 1600, 0.15, 5); },
    rumble() { A.tone(70, 0, 0.5, 'sine', 0.25, 55); A.tone(90, 0.3, 0.4, 'sine', 0.15, 60); },
    ouch() { A.tone(700, 0, 0.12, 'sine', 0.2, 500); A.tone(600, 0.15, 0.18, 'sine', 0.2, 420); },
    bye() { A.tone(784, 0, 0.3, 'triangle', 0.25); A.tone(587, 0.35, 0.5, 'triangle', 0.25); },
    flush() { A.hold(1.4, 'lowpass', 900, 0.18); A.tone(300, 0.9, 0.25, 'sine', 0.12, 700); },
    brush() { for (let i = 0; i < 6; i++) A.noise(i * 0.16, 0.1, 'highpass', 4000, 0.07); },
    flip() { A.tone(600, 0, 0.07, 'sine', 0.12, 950); },
    ding(i) { const f = A.midi(72 + [0, 2, 4, 7, 9, 12, 14, 16][(i || 0) % 8]); A.tone(f, 0, 0.35, 'sine', 0.22); A.tone(f * 2, 0, 0.2, 'sine', 0.06); },
    hmm() { A.tone(392, 0, 0.18, 'sine', 0.15); A.tone(349, 0.16, 0.25, 'sine', 0.15); },
    click() { A.tone(900, 0, 0.04, 'square', 0.05); },
    shake() { for (let i = 0; i < 3; i++) A.noise(i * 0.09, 0.07, 'bandpass', 500, 0.3, 2); },
    open() { [659, 784, 1047, 1319].forEach((f, i) => A.tone(f, i * 0.07, 0.2, 'sine', 0.2)); },
    sing() { A.melody([[72, 1], [76, 1], [79, 1], [76, 1], [77, 1], [74, 1], [72, 2]], 0.28, { vol: 0.16 }); },
  };
  // Brahms' lullaby, 8 bars, soft triangle
  const LULLABY = [[64, 1], [64, 1], [67, 2], [64, 1], [64, 1], [67, 2], [64, 1], [67, 1], [72, 1], [71, 1], [69, 2], [67, 2],
    [62, 1], [64, 1], [65, 2], [62, 1], [64, 1], [65, 2], [62, 1], [65, 1], [71, 1], [69, 1], [67, 2], [72, 2]];
  S.lullaby = () => {
    const beat = 0.5;
    const end = A.melody(LULLABY, beat, { vol: 0.16, music: true });
    for (let b = 0; b < 8; b++) A.tone(midi(b % 2 ? 43 : 48), b * 4 * beat, 4 * beat * 0.9, 'sine', 0.1, null, true);
    return end;
  };

  // --- particles: emoji and simple shapes, capped so weak phones keep 60 fps ---
  const bits = [];
  const MAXP = 40;
  K.bits = bits;
  K.burst = (x, y, size, n, set, opts) => {
    n = K.reduce ? Math.ceil(n / 2) : n;
    opts = opts || {};
    for (let i = 0; i < n; i++) {
      if (bits.length >= MAXP) bits.shift();
      const a = opts.down ? Math.PI / 2 + K.rand(-0.4, 0.4) : -Math.PI / 2 + (Math.random() - 0.5) * (opts.spread || 2.6);
      const v = K.rand(0.12, 0.32) * (opts.speed || 1);
      bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (opts.down ? 0 : 0.08), life: 1, e: K.pick(set || ['⭐', '✨', '💛']), s: size * K.rand(0.7, 1.1), rot: K.rand(-1, 1), g: opts.g === undefined ? 0.0003 : opts.g, fade: opts.fade || 1100 });
    }
  };
  K.party = () => {

<script>

SCN.games = {
  draw() {
    const R = L.R, m = Math.min(R.w, R.h);

    list.forEach((g, i) => {

// wardrobe: drag clothes onto the pet, tap what he wears to take it off
SCN.wardrobe = {
  enter() { G.w = { items: {}, page: 0 }; },
  leave() { G.w = null; },
  draw() {
    if (!G.w) this.enter();
    const w = G.w, R = L.R, m = Math.min(R.w, R.h);
    roomBg(R, '#fde8f1', '#f9d6e6', '#e7b07a', '#d39560', 0.66);
    // pet and mirror on one side, the 2×3 grid on the other
    let petArea, grid;
    if (L.land) { petArea = { x: R.x, y: R.y, w: R.w * 0.5, h: R.h }; grid = { x: R.x + R.w * 0.5, y: R.y + 12, w: R.w * 0.5 - 12, h: R.h - 24 }; }
    else { petArea = { x: R.x, y: R.y, w: R.w, h: R.h * 0.55 }; grid = { x: R.x + 10, y: R.y + R.h * 0.55, w: R.w - 20, h: R.h * 0.45 - 10 }; }
    const s = Math.min(petArea.w * 0.36 / 110, petArea.h * 0.62 / 125);

    // mirror shows the outfit

    ctx.fillStyle = '#dff3ff'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#d9a35a'; ctx.stroke(); ctx.clip();
    if (!S.asleep) { const o = petPose(); Object.assign(o, { x: mx, y: my + mh * 0.42, s: Math.min(s * 0.8, mw / 130), flip: true, alpha: 0.8, noShadow: true }); drawPet(o); }

    const owned = WEAR_ORDER.filter(id => S.wardrobe.includes(id));
    const pages = Math.max(1, Math.ceil(owned.length / 6));

    for (const id in w.items) if (!shown.includes(id) && !w.items[id].fly && !w.items[id].dragging) delete w.items[id];
    shown.forEach((id, i) => {

      const worn = Object.values(S.outfit).includes(id);
      if (worn) circle(hx, hy, isz * 0.48, '#ffe3ef');

      it.hx = hx; it.hy = hy; it.size = isz;

      const ax = grid.x + grid.w / 2, ay = grid.y + grid.h - arrowH / 2, as = 56;
      circle(ax, ay, as / 2, '#ffe9c7', '#f0b06e', 3);
      ctx.fillStyle = '#c9622e'; ctx.beginPath(); ctx.moveTo(ax - 7, ay - 11); ctx.lineTo(ax + 11, ay); ctx.lineTo(ax - 7, ay + 11); ctx.closePath(); ctx.fill();
      addT({ x: ax, y: ay, r: as / 2, pad: 16, tap() { w.page = (w.page + 1) % pages; K.sfx.whoosh(); } });
    }
    lightOverlay(R);
    for (const id in w.items) {
      const it = w.items[id];
      drawItem(it);
      if (S.asleep) continue;
      itemT(it, {
        tap() { flyTo(it, pet.cx, pet.cy - pet.r * 0.5, 450, () => { putOn(it.wear); sendHome(it); }, 40); },
        drop() { if (K.dist(it.x, it.y, pet.cx, pet.cy) < pet.r * 1.4) putOn(it.wear); sendHome(it); },
      });

  },
};
function putOn(id) {
  const slot = WEAR[id].slot;
  S.outfit[slot] = id;
  act('jump', 600); K.sfx.wish();
  K.burst(pet.cx, pet.cy - pet.r, 22, 5, ['✨', '💖']);

<script>
// Пуфик, part 3: egg, gifts, growth, wishes, mini-games, the attic (big colouring page, step-by-step drawing, steps, voices; gallery), the time limit, the frame loop, input, parent menu and debug.

// ---------- egg ----------
function drawEggScene(px, py) {
  const s = L.petS * 1.1;
  const since = G.now - (G.eggT || -1e9);
  const tilt = since < 600 ? Math.sin(since / 50) * 0.22 * (1 - since / 600) : Math.sin(G.now / 700) * 0.04;
  drawPet({ x: px, y: py, s, stage: 'egg', crack: S.eggTaps, tilt });
  const cy = py - 52 * s;
  addT({ x: px, y: cy, r: 60 * s, pad: 24, tap: eggTap });
  G.hint = { x: px, y: cy };
}
function eggTap() {
  S.eggTaps++; G.eggT = G.now;
  K.sfx.tock(); K.vibrate(20);
  const s = L.petS * 1.1;
  K.burst(L.R.x + L.R.w / 2, L.R.y + L.R.h * 0.88 - 90 * s, 20, 3, ['✨', '⭐']);
  if (S.eggTaps >= 6) hatch();
  Store.dirty();
}
function hatch() {
  S.stage = 'baby'; S.eggTaps = 0; S.friendship = 0;
  S.needs = { food: 80, energy: 90, clean: 95, fun: 85 };
  if (!S.stickers.includes(dayKey())) S.stickers.push(dayKey());
  act('hatch', 1200, { done() { pet.bounceT = G.now; } });
  K.sfx.fanfare(); K.party();
  G.nextWishAt = G.now + 45000;
  Store.saveNow();
}

// ---------- gifts ----------
function giftAvailable() { return S.stage !== 'egg' && !S.asleep && (S.lastGiftDate !== dayKey() || S.pendingGifts > 0); }
function drawGiftBox(R, fy) {
  if (!giftAvailable()) { G.box = null; return; }
  if (!G.box) G.box = { taps: 0, t: -1e9 };
  const b = G.box, s = K.clamp(Math.min(R.w, R.h) * 0.15, 60, 120);
  const x = R.x + R.w * (L.land ? 0.28 : 0.2), y = R.y + R.h - s * 0.55 - 6;
  const since = G.now - b.t, wob = since < 450 ? Math.sin(since / 35) * 0.2 * (1 - since / 450) : Math.sin(G.now / 900) * 0.04;
  K.emoji('🎁', x, y - (since < 450 ? Math.sin(since / 450 * Math.PI) * 10 : 0), s, wob);
  addT({ x, y, r: s * 0.55, pad: 16, tap() { b.taps++; b.t = G.now; K.sfx.shake(); K.vibrate(25); if (b.taps >= 3) openGift(x, y); } });
  if (!G.hint) G.hint = { x, y };
}
function openGift(x, y) {
  G.box = null;
  const growth = S.pendingGifts > 0;
  if (growth) S.pendingGifts--; else { S.lastGiftDate = dayKey(); addFriend(2); }
  const wearLeft = WEAR_ORDER.filter(id => !S.wardrobe.includes(id));
  const toysLeft = TOYS.filter(t => !S.roomToys.includes(t));
  let r;
  if (stageN() >= 2 && wearLeft.length && (growth || Math.random() < 0.5)) { r = { kind: 'wear', v: wearLeft[0] }; S.wardrobe.push(r.v); }
  else if (toysLeft.length && Math.random() < 0.65) { r = { kind: 'toy', v: K.pick(toysLeft) }; S.roomToys.push(r.v); }
  else { r = { kind: 'sticker', v: K.pick(WALL_STICKERS) }; S.wallStickers.push(r.v); }
  G.reveal = Object.assign(r, { t0: G.now });
  K.sfx.open(); setTimeout(K.sfx.fanfare, 250); K.party();
  pet.bounceT = G.now + 300;
  Store.saveNow();
}
function drawReveal() {
  const r = G.reveal; if (!r) return;
  const p = (G.now - r.t0) / 2600;
  if (p >= 1) { G.reveal = null; return; }
  const cx = K.W / 2, cy = K.H * 0.42, sz = Math.min(K.W, K.H) * 0.3 * K.back(Math.min(1, p * 3));
  ctx.save(); ctx.globalAlpha = p > 0.8 ? (1 - p) / 0.2 : 1;
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, sz * 1.1);
  g.addColorStop(0, 'rgba(255,240,160,.9)'); g.addColorStop(1, 'rgba(255,240,160,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, sz * 1.1, 0, TAU); ctx.fill();
  if (r.kind === 'wear') drawWearIcon(r.v, cx, cy, sz / 70); else K.emoji(r.v, cx, cy, sz);
  ctx.restore();
}

// ---------- growth ----------
Grow.onStage = st => { G.pendingStage = st; };
function checkStage() {
  if (S.stage === 'baby' && S.friendship >= 150) G.pendingStage = 'kid';
  else if (S.stage === 'kid' && S.friendship >= 450) G.pendingStage = 'big';
}
function stepGrowth() {
  // friendship in the ceremony's first half (a stroke, a treat, the gift box) re-arms the stage he is growing into: drop it
  if (STAGES.indexOf(G.pendingStage) <= stageN()) G.pendingStage = null;
  if (!G.pendingStage || !K.playing || busy() || !pet.visible || G.trans || S.asleep || G.scene === 'mg' || G.scene === 'limit') return;
  const st = G.pendingStage; G.pendingStage = null;
  K.sfx.fanfare();
  act('grow', 4000, { keep: 1,
    mid() { S.stage = st; S.pendingGifts++; Store.saveNow(); K.party(); },
    done() { K.sfx.wish(); K.party(); checkStage(); },
  });
}

// ---------- wishes ----------
function updateWishes() {
  if (!K.playing || S.stage === 'egg' || S.asleep || G.scene === 'mg' || G.scene === 'limit') return;
  const now = G.now;
  if (G.wish && now > G.wish.until) G.wish = null;
  if (G.potty && Date.now() > G.potty.until) G.potty = null;
  if (G.wash && Date.now() > G.wash.until) G.wash = null;
  if (S.settings.potty && S.pottyAt && Date.now() >= S.pottyAt && !G.potty) { G.potty = { until: Date.now() + 5 * MIN }; S.pottyAt = null; }
  if (!G.nextWishAt) G.nextWishAt = now + K.rand(40000, 70000);
  if (!G.wish && now >= G.nextWishAt) {
    G.nextWishAt = now + K.rand(90000, 150000);
    const opts = [{ kind: 'pet', e: '🤚' }, { kind: 'song', e: '🎵', room: 'living' }];
    if (stageN() >= 2 && S.wardrobe.length) opts.push({ kind: 'hat', e: '👒', room: 'wardrobe' });
    const foods = FOODS.filter(f => f.st <= stageN() && f.id !== S.disliked.food && !f.sweet && f.id !== 'porridge');
    const f = K.pick(foods);
    if (f) opts.push({ kind: 'food', e: f.e, food: f.id, room: 'kitchen' });
    const m = minuteOfDay(Date.now());
    if (m >= 13 * 60 && m < 15 * 60 && S.needs.energy < 70) opts.push({ kind: 'nap', e: '🌙', room: 'bed' });
    if (SCN.attic && S.atticDay !== dayKey() && S.needs.fun < 60) opts.push({ kind: 'attic', e: '🎨', room: 'attic' });
    G.wish = Object.assign({}, K.pick(opts), { until: now + 60000 });
  }
}

// ---------- the per-second simulation tick ----------
function tick() {
  const nowMs = Date.now();
  const dt = nowMs - G.lastTick;
  if (dt < 1000) return;
  G.lastTick = nowMs;
  const n = S.needs;
  if (dt > 5000) simulateAway(nowMs - dt, nowMs);
  else {
    const h = dt / HOUR, r = S.asleep ? (S.napUntil ? RATE.nap : RATE.sleep) : RATE.awake;
    for (const k of NEEDS) {
      let d = r[k] * h;
      if (k === 'energy' && S.asleep && G.now < G.bed.lullabyUntil) d *= 2;
      if (k === 'energy' && !S.asleep && G.scene === 'mg') d = -20 * h;
      if (S.stage === 'egg') d = 0;
      n[k] = K.clamp(n[k] + d, 0, 100);
    }
  }
  S.lastSeen = nowMs;
  G.dirtyAcc += dt; if (G.dirtyAcc > 10000) { G.dirtyAcc = 0; Store.dirty(); }
  const today = dayKey();
  if (S.played.date !== today) S.played = { date: today, ms: 0 };
  if (K.playing && !document.hidden && G.scene !== 'limit' && dt <= 5000) {
    S.played.ms += dt; G.minAcc += dt;
    if (G.minAcc >= MIN) { G.minAcc -= MIN; stat('min'); }
  }
  if (K.playing && S.stage !== 'egg' && !S.stickers.includes(today)) S.stickers.push(today);

  // night and morning
  const night = isNight();
  K.audio.quiet = night ? 0.5 : 1; K.audio.apply();
  if (S.stage !== 'egg') {
    if (night) {
      if (S.napUntil) S.napUntil = null;
      if (!S.asleep) {
        S.asleep = true; pet.flip = false;
        if (K.playing) { act('yawn', 1200); K.sfx.yawn(); }
      }
      if (K.playing && G.scene !== 'bed' && G.scene !== 'limit' && !G.trans && !G.goodbye) {
        if (G.scene === 'mg') setScene('games');
        goRoom('bed');
      }
    } else {
      if (S.asleep && !S.napUntil) { S.asleep = false; G.bed.curtain = true; act('stretch', 1300); if (K.playing) K.sfx.yawn(); }
      else if (S.asleep && S.napUntil && nowMs >= S.napUntil) wakeUp();
    }
  }

  if (S.lockUntil && nowMs >= S.lockUntil) {
    S.lockUntil = 0; S.played.ms = 0; Store.dirty();
    if (G.scene === 'limit') setScene(isNight() ? 'bed' : 'living');
  }
  const l = limitMs();
  if (l > 0 && K.playing && S.played.ms >= l && !G.goodbye && G.scene !== 'limit' && S.stage !== 'egg') startGoodbye();

}
function startGoodbye() {
  G.goodbye = true;
  const finish = () => {
    G.goodbye = false;
    const p = S.settings.pause;
    S.lockUntil = p === '1h' ? Date.now() + HOUR : p === '3h' ? Date.now() + 3 * HOUR : nextAt(S.settings.wakeup);
    G.trans = null; pet.tdx = 0;

  };

  if (G.scene === 'mg') setScene('games');
  act('wave', 2200, { done: finish, keep: 1 }); K.sfx.bye();
}
SCN.limit = {
  draw() {
    const W = K.W, H = K.H, m = Math.min(W, H);
    rect(0, 0, W, H, grad(0, H, '#101a4a', '#2c3c86'));
    for (let i = 0; i < 24; i++) K.emoji('✦', (i * 97 % 100) / 100 * W, (i * 61 % 55) / 100 * H, m * 0.025, 0, 0.4 + 0.4 * Math.sin(G.now / 700 + i));

    rrect(hx + hw * 0.12, hy + hh * 0.42, hw * 0.2, hh * 0.58, 8, '#7a4a2a');
    rrect(hx + hw * 0.52, hy + hh * 0.22, hw * 0.32, hh * 0.36, 6, '#2a3566', '#fff', 4);

    const k = (G.now / 1600) % 1;

    ctx.textAlign = 'start';

// ---------- mini-games ----------
const MG = {};
function startMinigame(id) {
  const from = G.scene === 'mg' ? (G.mg && G.mg.from) || 'games' : G.scene;
  G.mg = { id, t0: G.now, dur: MG[id].dur || ({ hide: 60000, memory: 150000, puzzle: 150000, sort: 150000 })[id] || 50000, end: 0, d: {}, from };

SCN.mg = {

const fieldPetS = () => Math.min(K.W * 0.38 / 110, K.H * 0.34 / 120);

MG.ball = {
  start(d) {
    const r = K.clamp(Math.min(K.W, K.H) * 0.085, 45, 70);
    d.ball = { x: K.W * 0.25, y: K.H * 0.25, vx: 0.14, vy: 0, r, rot: 0, fly: null };
  },
  draw(d, dt) {
    const W = K.W, H = K.H, floor = H * 0.88;
    rect(0, 0, W, H, grad(0, floor, '#9fdcff', '#e3f6ff'));
    K.emoji('☁️', (G.now / 60) % (W + 200) - 100, H * 0.16, Math.min(W, H) * 0.14, 0, 0.9);
    rect(0, floor - 10, W, H - floor + 10, grad(floor - 10, H, '#8fd27a', '#6cbb5a'));

    renderPet(W / 2, floor, fieldPetS(), busy() ? null : { mouth: 'big' });
    petTarget();
    if (b.fly) {
      const f = b.fly, p = K.clamp((G.now - f.t0) / 700, 0, 1), e = K.easeInOut(p);
      const tx = pet.cx, ty = pet.cy - pet.r * 1.05;
      b.x = f.x + (tx - f.x) * e; b.y = f.y + (ty - f.y) * e - Math.sin(p * Math.PI) * H * 0.18; b.rot += 0.2;
      if (p >= 1) {
        b.fly = null; act('head', 500); K.sfx.boing(); K.burst(b.x, b.y, 22, 4, ['⭐', '✨']);
        b.vx = (Math.random() < 0.5 ? -1 : 1) * K.rand(0.16, 0.3);
        b.vy = -Math.sqrt(2 * 0.0012 * H * K.rand(0.35, 0.5));
      }
    } else {
      b.vy += 0.0012 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > floor - b.r) { b.y = floor - b.r; b.vy = -Math.abs(b.vy) * 0.55; if (Math.abs(b.vy) < 0.08) b.vy = 0; b.vx *= 0.9; }
      if (b.vy === 0) b.vx *= Math.pow(0.9985, dt);
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
      if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
      b.rot += b.vx * dt / b.r;

    K.emoji('⚽', b.x, b.y, b.r * 2, b.rot);
    if (!b.fly && !G.mg.end) addT({ x: b.x, y: b.y, r: b.r, pad: 26, instant: true, tap() { b.fly = { x: b.x, y: b.y, t0: G.now }; K.sfx.click(); K.sfx.pop(2); } });
    G.hint = { x: b.x, y: b.y };
  },
};

MG.hide = {

    const c = PAL[S.color] || PAL.peach;
    d.objs.forEach((o, i) => {
      const x = W * (i + 0.5) / n, y = floor - size * 0.45;
      const since = G.now - o.wob, wob = since < 450 ? Math.sin(since / 40) * 0.12 * (1 - since / 450) : 0;
      // ears peek out over the hiding place

      if (o.e === 'curtain') {

        rect(x - cw / 2 - 6, y - ch / 2 - 8, cw + 12, 8, '#9b6438');
        for (let k = 0; k < 4; k++) rrect(x - cw / 2 + k * cw / 4, y - ch / 2, cw / 4 + 2, ch, 8, k % 2 ? '#ff9db5' : '#ff86a5');
      } else K.emoji(o.e, x, y, size);
      ctx.restore();
      if (d.pop && d.pop.i === i) {
        const p = (G.now - d.pop.t0) / 1300;
        renderPet(x, y - size * 0.25 - Math.sin(Math.min(1, p * 2) * Math.PI / 2) * size * 0.2, fieldPetS() * 0.75, { eyes: 'happy', mouth: 'big', wave: p });
        if (p >= 1) {

        if (i === d.at) {
          d.pop = { i, t0: G.now }; d.found++; K.sfx.kuku(); K.burst(x, y - size * 0.5, 26, 8, ['✨', '⭐', '💛']); addFriend(0);
        } else { o.wob = G.now; K.sfx.rustle(); }
      } });
    });
    if (G.mg.end) renderPet(W / 2, floor + (H - floor) * 0.6, fieldPetS() * 0.8);

MG.bubbles = {
  start(d) { d.list = []; d.next = 600; d.pops = 0; },
  draw(d, dt) {
    const W = K.W, H = K.H, m = Math.min(W, H), floor = H * 0.9;

// memory: find the pairs; 2 pairs for the little one, up to 4 later; two boards per round
const MEM_SET = ['🍎', '🐶', '🐱', '🚗', '🌸', '🐟', '🎈', '🐥'];
MG.memory = {
  start(d) { d.round = 0; d.cards = []; this.deal(d); },
  deal(d) {
    const base = stageN() >= 3 ? 3 : stageN() >= 2 ? 3 : 2;
    const pairs = Math.min(4, base + d.round);
    const em = K.shuffle(MEM_SET.slice()).slice(0, pairs);
    d.cards = K.shuffle(em.concat(em)).map(e => ({ e, open: false, done: false, flipT: -1e9 }));
    d.sel = []; d.closeAt = 0; d.dealAt = 0; d.matchAt = 0;
  },
  draw(d) {
    const W = K.W, H = K.H;
    rect(0, 0, W, H, grad(0, H, '#e7f6ff', '#fff1d6'));
    const now = G.now;
    // a wrong pair turns back over after a moment; a finished board deals the next one
    if (d.closeAt && now > d.closeAt) { d.closeAt = 0; for (const c of d.sel) { c.open = false; c.flipT = now; } d.sel = []; K.sfx.flip(); }
    if (d.matchAt && now > d.matchAt) {
      d.matchAt = 0;
      for (const c of d.sel) c.done = true;
      d.sel = [];
      K.sfx.wish(); act('clap', 900);
      if (d.cards.every(c => c.done)) { d.round++; K.party(); if (d.round >= 2) endMinigame(); else d.dealAt = now + 1600; }
    }
    if (d.dealAt && now > d.dealAt && !G.mg.end) { this.deal(d); K.sfx.whoosh(); }
    const n = d.cards.length, cols = L.land ? n / 2 : 2, rows = Math.ceil(n / cols);
    const top = L.land ? 16 : L.btn + 28, left = L.land ? L.btn + 36 : 16;
    const petH = H * (L.land ? 0.26 : 0.2);
    const aw = W - left - 16, ah = H - top - petH - 10, gap = 14;
    const cw = Math.min((aw - gap * (cols - 1)) / cols, ((ah - gap * (rows - 1)) / rows) / 1.2, 190), ch = cw * 1.2;
    const x0 = left + (aw - (cols * cw + (cols - 1) * gap)) / 2, y0 = top + (ah - (rows * ch + (rows - 1) * gap)) / 2;
    d.cards.forEach((c, i) => {
      const x = x0 + (i % cols) * (cw + gap), y = y0 + Math.floor(i / cols) * (ch + gap);
      const k = K.clamp((now - c.flipT) / 260, 0, 1);
      const face = c.open ? k >= 0.5 : k < 0.5;
      const sx = Math.max(0.04, Math.abs(1 - 2 * k));
      ctx.save(); ctx.translate(x + cw / 2, y + ch / 2); ctx.scale(sx, 1);
      if (c.done) { ctx.globalAlpha = 0.9; rrect(-cw / 2 - 5, -ch / 2 - 5, cw + 10, ch + 10, 22, '#fff3a6'); }
      rrect(-cw / 2, -ch / 2 + 5, cw, ch, 18, '#0000001a');
      if (face) { rrect(-cw / 2, -ch / 2, cw, ch, 18, '#ffffff', '#f0dcc4', 3); K.emoji(c.e, 0, 0, cw * 0.6); }
      else {
        rrect(-cw / 2, -ch / 2, cw, ch, 18, '#ffb36b', '#e08a3f', 3);
        K.emoji('🐾', 0, 0, cw * 0.38, 0, 0.55);
      }
      ctx.restore();
      if (!c.open && !c.done && !G.mg.end) addT({ x, y, w: cw, h: ch, pad: 4, instant: true, tap() {
        if (d.sel.length >= 2 || d.closeAt || d.matchAt) return;
        c.open = true; c.flipT = now; K.sfx.flip(); d.sel.push(c);
        if (d.sel.length === 2) {
          if (d.sel[0].e === d.sel[1].e) { d.matchAt = now + 450; K.burst(x + cw / 2, y + ch / 2, 22, 5, ['✨', '⭐']); }
          else { d.closeAt = now + 1100; setTimeout(K.sfx.hmm, 350); }
        }
      } });
    });
    renderPet(W / 2, H - 6, Math.min(fieldPetS() * 0.7, (petH - 6) / 125), busy() ? null : { mouth: 'big' });
    petTarget();
  },
};

// puzzle: put the picture back together. 2 halves, then 3 strips, then 4 quarters; Пуфик watches and claps
const PICS = ['🍎', '🦆', '🧸', '⚽', '🍓', '🎈', '🐟', '🌙'];
const PASTELS = ['#ffe3b3', '#d6f2ff', '#e4d9ff', '#d8f5d0', '#ffd9e8'];
MG.puzzle = {
  start(d) { d.round = 0; d.pics = K.shuffle(PICS.slice()); this.deal(d); },
  deal(d) {
    const cap = stageN() >= 3 ? 4 : stageN() >= 2 ? 3 : 2;
    const n = Math.min(cap, d.round === 0 ? 2 : d.round === 1 ? 3 : 4);
    d.cols = n === 4 ? 2 : n; d.rows = n === 4 ? 2 : 1;
    d.pic = d.pics[d.round % d.pics.length]; d.tint = PASTELS[d.round % PASTELS.length];
    const order = K.shuffle([...Array(n).keys()]);
    d.pieces = order.map((k, i) => ({ col: k % d.cols, row: Math.floor(k / d.cols), slot: i, it: item('', 0, {}), locked: false, shake: -1e9 }));
    d.sel = null; d.doneAt = 0;
  },
  layout(d) {
    const W = K.W, H = K.H, top = L.btn + 22;
    const trayH = K.clamp(H * (L.land ? 0.3 : 0.24), 90, 220);
    const P = Math.min(W * (L.land ? 0.42 : 0.62), H - top - trayH - 24, 360);
    d.P = P; d.pw = P / d.cols; d.ph = P / d.rows;
    d.px = L.land ? W * 0.42 - P / 2 : 14; d.py = top + (H - top - trayH - P) / 2;
    d.trayY = H - trayH / 2; d.trayH = trayH;
    // pieces wait in the tray at a smaller scale and grow to full size in hand
    const n = d.pieces.length;
    d.tk = Math.min(1, (trayH - 20) / d.ph, (W - 24) / (n * d.pw * 1.12));
    const span = Math.min(W - 20, n * d.pw * d.tk * 1.12);
    d.pieces.forEach((p, i) => {
      const it = p.it;
      it.hx = W / 2 - span / 2 + span * (p.slot + 0.5) / n; it.hy = d.trayY;
      if (p.locked) { it.hx = d.px + (p.col + 0.5) * d.pw; it.hy = d.py + (p.row + 0.5) * d.ph; }
      const want = p.locked || it.dragging ? 1 : d.sel === p ? Math.min(1, d.tk * 1.25) : d.tk;
      p.k = p.k === undefined ? want : p.k + (want - p.k) * 0.25;
      stepItem(it);
    });
  },
  drawPicture(d, x, y, alpha) {
    ctx.save(); if (alpha !== undefined) ctx.globalAlpha *= alpha;
    rrect(x, y, d.P, d.P, d.P * 0.16, d.tint);
    K.emoji(d.pic, x + d.P / 2, y + d.P / 2, d.P * 0.7);
    ctx.restore();
  },
  drawPiece(d, p, x, y, lift, k) {
    const w = d.pw, h = d.ph; k = k || 1;
    ctx.save(); ctx.translate(x, y - (lift ? 8 : 0)); ctx.scale(k, k);
    ctx.save();
    if (lift) { ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 8; }
    ctx.beginPath(); K.roundRect(-w / 2, -h / 2, w, h, 10); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.clip();
    this.drawPicture(d, -w / 2 - p.col * w, -h / 2 - p.row * h);
    ctx.restore();
    ctx.beginPath(); K.roundRect(-w / 2, -h / 2, w, h, 10); ctx.strokeStyle = lift ? '#ff8a4c' : '#ffffffcc'; ctx.lineWidth = (lift ? 4 : 3) / k; ctx.stroke();
    ctx.restore();
  },
  draw(d) {
    const W = K.W, H = K.H, now = G.now;
    rect(0, 0, W, H, grad(0, H, '#fff1d6', '#ffe2b8'));
    this.layout(d);
    // frame with a faint ghost of the whole picture inside
    rrect(d.px - 10, d.py - 10, d.P + 20, d.P + 20, d.P * 0.16 + 8, '#ffffffaa', '#f0dcc4', 3);
    this.drawPicture(d, d.px, d.py, 0.18);
    ctx.setLineDash([8, 8]); ctx.strokeStyle = '#d9a35a'; ctx.lineWidth = 2;
    for (let c = 1; c < d.cols; c++) { ctx.beginPath(); ctx.moveTo(d.px + c * d.pw, d.py); ctx.lineTo(d.px + c * d.pw, d.py + d.P); ctx.stroke(); }
    for (let r = 1; r < d.rows; r++) { ctx.beginPath(); ctx.moveTo(d.px, d.py + r * d.ph); ctx.lineTo(d.px + d.P, d.py + r * d.ph); ctx.stroke(); }
    ctx.setLineDash([]);
    // tray
    rrect(10, d.trayY - d.trayH / 2 + 6, W - 20, d.trayH - 12, 20, '#ffffff88');
    // the pet beside the frame, following the piece in hand
    const side = L.land ? { x: W * 0.78, w: W * 0.4 } : { x: d.px + d.P + (W - d.px - d.P) / 2, w: W - d.px - d.P };
    const ps = Math.min(side.w * 0.8 / 110, (d.P + 10) / 130, fieldPetS());
    const done = d.doneAt && now - d.doneAt < 2200;
    renderPet(side.x, d.py + d.P + 6, ps, done || busy() ? null : { mouth: 'big' });
    petTarget();
    // locked pieces first, then loose ones, the one in hand on top
    const locked = d.pieces.filter(p => p.locked), loose = d.pieces.filter(p => !p.locked);
    for (const p of locked) this.drawPiece(d, p, p.it.x, p.it.y, false, 1);
    if (done) {
      const k = (now - d.doneAt) / 2200;
      ctx.save(); ctx.globalAlpha = 0.9; rrect(d.px, d.py, d.P, d.P, d.P * 0.16, `rgba(255,255,255,${0.5 * Math.sin(Math.min(1, k * 2) * Math.PI)})`); ctx.restore();
    }
    for (const p of loose) {
      const it = p.it, lift = it.dragging || d.sel === p;
      const sh = now - p.shake < 400 ? Math.sin((now - p.shake) / 30) * 6 : 0;
      if (it.dragging) { lookAt(it.x, it.y); continue; }
      this.drawPiece(d, p, it.x + sh, it.y, lift, p.k);
    }
    for (const p of loose) if (p.it.dragging) this.drawPiece(d, p, p.it.x, p.it.y, true, p.k);
    // touch: empty slots take a lifted piece, loose pieces drag or lift
    if (!G.mg.end && !d.doneAt) {
      for (let r = 0; r < d.rows; r++) for (let c = 0; c < d.cols; c++) {
        if (d.pieces.some(p => p.locked && p.col === c && p.row === r)) continue;
        addT({ x: d.px + c * d.pw, y: d.py + r * d.ph, w: d.pw, h: d.ph, pad: 6, tap() {
          const p = d.sel; if (!p) return;
          d.sel = null;
          if (p.col === c && p.row === r) MG.puzzle.lock(d, p); else { p.shake = G.now; K.sfx.oops(); }
        } });
      }
      for (const p of loose) {
        const it = p.it; if (it.fly) continue;
        addT({ x: it.x - d.pw * p.k / 2, y: it.y - d.ph * p.k / 2, w: d.pw * p.k, h: d.ph * p.k, pad: 10, drag: it,
          tap() { it.home = true; d.sel = d.sel === p ? null : p; K.sfx.pop(2); },
          drop() {
            const sx = d.px + (p.col + 0.5) * d.pw, sy = d.py + (p.row + 0.5) * d.ph;
            const near = Math.abs(it.x - sx) < d.pw * 0.4 && Math.abs(it.y - sy) < d.ph * 0.4;
            const overFrame = it.x > d.px - d.pw * 0.3 && it.x < d.px + d.P + d.pw * 0.3 && it.y > d.py - d.ph * 0.3 && it.y < d.py + d.P + d.ph * 0.3;
            if (near) MG.puzzle.lock(d, p);
            else { if (overFrame) { p.shake = G.now; K.sfx.oops(); } sendHome(it); }
          } });
      }
      const w = loose.find(p => !p.it.fly);
      if (w) G.hint = { x: w.it.x, y: w.it.y };
    }
    if (d.doneAt && now - d.doneAt > 2200) { d.round++; if (d.round >= 3) endMinigame(); else { this.deal(d); K.sfx.whoosh(); } }
  },
  lock(d, p) {
    const it = p.it, sx = d.px + (p.col + 0.5) * d.pw, sy = d.py + (p.row + 0.5) * d.ph;
    p.locked = true; d.sel = null; it.dragging = false;
    flyTo(it, sx, sy, 180, () => { it.home = true; });
    K.sfx.flip(); K.burst(sx, sy, 18, 3, ['✨']);
    if (d.pieces.every(q => q.locked)) {
      d.doneAt = G.now; K.sfx.wish(); act('clap', 1200); K.party();
    }
  },
};

// sorting: Пуфик holds up a toy, the child drops it into the basket of the same colour. 2 colours, then 3, then 4
const SORT_COLORS = [
  { name: 'red', fill: '#ff4d4d', dark: '#c42b2b' },
  { name: 'yellow', fill: '#ffd23f', dark: '#d9a400' },
  { name: 'blue', fill: '#3d8bff', dark: '#1f5fc4' },
  { name: 'green', fill: '#4cc94c', dark: '#2e962e' },
];
const TOY_SHAPES = ['ball', 'star', 'heart', 'cube', 'tri'];
function drawToyShape(shape, x, y, r, c, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.fillStyle = c.fill; ctx.strokeStyle = c.dark; ctx.lineWidth = Math.max(3, r * 0.08); ctx.lineJoin = 'round';
  ctx.beginPath();
  if (shape === 'ball') ctx.arc(0, 0, r, 0, TAU);
  else if (shape === 'cube') K.roundRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7, r * 0.3);
  else if (shape === 'tri') { ctx.moveTo(0, -r); ctx.lineTo(r * 0.95, r * 0.7); ctx.lineTo(-r * 0.95, r * 0.7); ctx.closePath(); }
  else if (shape === 'star') {
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.48 : r * 1.05; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath();
  } else if (shape === 'heart') {
    ctx.moveTo(0, r * 0.85);
    ctx.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.6, -r * 1.2, 0, -r * 0.45);
    ctx.bezierCurveTo(r * 0.6, -r * 1.2, r * 1.4, -r * 0.1, 0, r * 0.85);
  }
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffffff88'; ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.35, r * 0.18, r * 0.11, -0.6, 0, TAU); ctx.fill();
  ctx.restore();
}
MG.sort = {
  start(d) { d.round = 0; this.deal(d); },
  deal(d) {
    const cap = stageN() >= 3 ? 4 : stageN() >= 2 ? 3 : 2;
    const n = Math.min(cap, 2 + d.round);
    d.baskets = K.shuffle(SORT_COLORS.slice(0, n).slice()).map(c => ({ c, count: 0, shake: -1e9, hop: -1e9 }));
    d.deck = [];

};

// ----- round flow: intro → (ask → input → right)×N → concert → done. Wrong taps bounce back through 'answer'.
function voicesRound(d, force) {                   // the same one is not asked twice in a row (with only 2 animals: not thrice)
  const prev = d.target, pool = d.cast.filter(a => a !== prev || (d.cast.length < 3 && d.streak < 2));
  d.target = force || K.pick(pool); d.streak = d.target === prev && !force ? d.streak + 1 : 1;

}
function voicesAsk(d) {                            // the question: Пуфик listens to the sky, the voice plays once
  d.state = 'input'; d.voiceAt = G.now; d.voiceMs = voicesSing(d.target.e, 1, 0); d.bEmoji = '🎵❓'; d.pulseAt = G.now;
}

MG.voices = {
  get dur() { return 120000; },
  multi: false,
  start(d) {
    const n = K.clamp(stageN() + 1, 2, 4);         // baby 2, kid 3, big 4
    d.cast = K.shuffle(VOICES_CAST.slice()).slice(0, n).map((e, i) => ({ e, x: 0, y: 0, bornAt: G.now + 200 + i * 130, wobAt: -1e9, jumpAt: -1e9, singAt: -1e9, singMs: 1 }));
    d.total = stageN() <= 1 ? 6 : 8; d.round = 0; d.target = null; d.streak = 0; d.wrongs = 0;
    d.state = 'intro'; d.t = G.now + 1300; d.voiceAt = -1e9; d.voiceMs = 0; d.pulseAt = G.now; d.bEmoji = '👂';
    d.bx = d.by = 0; d.side = 1;
    act('wave', 800);
  },
  draw(d) {
    const now = G.now, W = K.W, end = G.mg.end;
    voicesLayout(d); voicesScene(d, now);
    if (!end && now > d.t) {
      if (d.state === 'intro') voicesRound(d);
      else if (d.state === 'ask' || d.state === 'answer') voicesAsk(d);
      else if (d.state === 'right') voicesNext(d);
      else if (d.state === 'concert') { d.state = 'done'; d.bEmoji = '🎉'; endMinigame(); }
    }
    const asking = now - d.voiceAt < d.voiceMs + 250;      // the question is in the air
    if (!end && d.state === 'input' && !asking && now - Math.max(d.voiceAt, G.lastTouch) > 4000) voicesAsk(d);   // idle: ask again
    for (const a of d.cast) voicesMound(a.x, a.y, d.mr);
    for (const a of d.cast) voicesAnimal(d, a, now);
    // Пуфик: head tilted to the sky while the voice sounds, a 👂 beside his ear; otherwise his act / a smile
    const lis = asking && d.state === 'input' ? K.clamp(Math.min((now - d.voiceAt) / 250, (d.voiceAt + d.voiceMs + 250 - now) / 250), 0, 1) : 0;
    d.side = d.petX > W * 0.55 ? -1 : 1;
    const extra = { noShadow: !L.land };                   // on the phone he hovers in the sky, as in the mock-up
    if (lis > 0) Object.assign(extra, { tilt: d.side * 0.17 * K.easeInOut(lis), eyes: 'open', mouth: 'o' });
    else if (!busy() && !end) extra.mouth = d.state === 'input' ? 'smile' : 'big';

    if (lis > 0) { lookAt(d.bx, d.by - 400); K.emoji('👂', pet.cx - d.side * (pet.r * 0.95 + d.R * 0.7), d.by + Math.sin(now / 150) * 3, d.R * 1.1 * (0.6 + 0.4 * lis), 0, lis); }
    else if (d.state === 'input' && d.wrongs >= 2) lookAt(d.target.x, voicesTop(d, d.target));
    voicesBubble(d, now, asking && d.state === 'input');
    if (end) return;
    // touch: one slot-wide column per animal (no overlaps, ≥ 90 px wide), Пуфик and the bubble on top
    if (d.state === 'input') {
      const top = d.my - d.mr * 0.45 - d.es - 24 * d.u, ty = voicesTop(d, d.target);
      for (const a of d.cast) addT({ x: a.x - d.slot / 2, y: top, w: d.slot, h: d.my + d.mr * 0.6 - top, pad: 0, tap() { voicesTap(d, a); } });

      if (d.wrongs >= 2 && now - G.lastTouch < 8000) K.emoji('👆', d.target.x + 16, ty + 44 + Math.sin(now / 220) * 8, 46);
    }
    petTarget(() => { voicesReplay(d); return true; });
    addT({ x: d.bx, y: d.by, r: d.R, pad: 12, tap() { voicesReplay(d); } });
  },
};

  drawReveal();
  K.drawBits(dt);
  if (!G.hint && K.playing && !full && S.stage !== 'egg') {
    let low = null;
    for (const r of L.rings) if (S.needs[r.k] < 40 && (!low || S.needs[r.k] < S.needs[low.k])) low = r;
    if (low) G.hint = { x: low.x, y: low.y };
  }
  drawHint();
  if (G.trans) {
    const p = (G.now - G.trans.t0) / 600;
    rect(0, 0, K.W, K.H, `rgba(255,255,255,${0.3 * Math.sin(K.clamp(p, 0, 1) * Math.PI)})`);
  }
  // night: after two quiet minutes the screen fades to a nightlight
  if (K.playing && isNight() && G.scene !== 'limit' && G.now - G.lastTouch > 2 * MIN) G.dim = true;
  if (G.dim) {
    rect(0, 0, K.W, K.H, 'rgba(5,8,30,.86)');
    const g = ctx.createRadialGradient(K.W / 2, K.H * 0.6, 4, K.W / 2, K.H * 0.6, Math.min(K.W, K.H) * 0.3);
    g.addColorStop(0, 'rgba(255,220,140,.18)'); g.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, K.W, K.H);
  }
};

// ---------- input ----------
const ptrs = new Map();
K.onDown = (x, y, id) => {
  G.lastTouch = G.now;
  if (G.dim) { G.dim = false; return; }
  K.vibrate(12);
  lookAt(x, y);
  const t = G.scene === 'limit' ? null : findT(x, y);
  const p = { t, x0: x, y0: y, x, y, moved: 0, path: 0, t0: G.now };
  ptrs.set(id, p);
  if (!t) { K.burst(x, y, 18, 3, ['✨', '⭐', '💫'], { speed: 0.6 }); K.sfx.tick(); return; }
  if (t.instant) { p.done = true; t.tap(x, y, p); return; }
  if (t.down) t.down(x, y, p);
  if (t.drag) { const it = t.drag; p.item = it; p.offx = it.x - x; p.offy = it.y - y; it.dragging = true; it.home = false; it.fly = null; K.sfx.pop(0); }
};
K.onMove = (x, y, id) => {
  const p = ptrs.get(id); if (!p) return;
  G.lastTouch = G.now;
  const d = K.dist(x, y, p.x, p.y);
  p.moved = Math.max(p.moved, K.dist(x, y, p.x0, p.y0)); p.path += d; p.x = x; p.y = y;
  if (pet.visible && Math.random() < 0.3) lookAt(x, y);
  if (p.item) { p.item.x = x + p.offx; p.item.y = y + p.offy; }
  if (p.t && p.t.move && !p.done) p.t.move(x, y, p, d);
};
K.onUp = (x, y, id) => {
  const p = ptrs.get(id); ptrs.delete(id);
  if (!p || !p.t || p.done) return;
  const t = p.t;
  if (p.item) p.item.dragging = false;
  if (x < -9000) { if (p.item) sendHome(p.item); return; }
  if (p.moved < 14) { if (t.tap) t.tap(x, y, p); else if (p.item) sendHome(p.item); }
  else if (t.drop) t.drop(x, y, p);
  else if (p.item) sendHome(p.item);
};

K.onStart = () => {
  G.lastTouch = G.now; G.dim = false; K.multi = false; ptrs.clear();
  applySettings();
  if (S.lockUntil && Date.now() < S.lockUntil) { setScene('limit'); return; }
  if (S.stage === 'egg') { setScene('living'); return; }
  setScene(isNight() ? 'bed' : 'living');
  if (G.greet && !isNight()) { G.greet = false; act('greet', 2000); K.sfx.wish(); setTimeout(() => K.burst(pet.cx, pet.cy - pet.r, 26, 6, ['💖', '✨', '💛']), 300); }
};
K.onStop = () => {
  ptrs.clear();
  if (G.scene !== 'limit') setScene(S.asleep ? 'bed' : 'living');
  G.trans = null; pet.tdx = 0; G.dim = false;
  Store.saveNow();
  updateTitle();
};

// ---------- parent menu ----------
const STAGE_NAME = { egg: 'ещё в яйце', baby: 'малыш', kid: 'подрос', big: 'большой' };
const COLOR_NAME = { peach: 'Персиковый', mint: 'Мятный', lavender: 'Лавандовый', blue: 'Голубой' };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parentEl = document.getElementById('parent'), sheet = document.getElementById('sheet');
function applySettings() {
  K.audio.vol = S.settings.volume; K.audio.mus = S.settings.music; K.audio.apply();
  K.vibeOn = !!S.settings.vibrate;
}
function updateTitle() {
  document.getElementById('title').textContent = S.name || 'Пуфик';
  document.getElementById('subtitle').textContent = S.stage === 'egg' ? 'В яйце кто-то есть! Постучи по нему.' : 'Твой пушистый друг ждёт тебя!';
}
(() => {
  const gear = document.getElementById('gear');
  let holdT = null;
  const cancel = () => { clearTimeout(holdT); gear.classList.remove('holding'); };
  gear.addEventListener('pointerdown', e => {
    e.preventDefault();
    gear.classList.add('holding');
    holdT = setTimeout(() => { cancel(); openGate(); }, 3000);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => gear.addEventListener(ev, cancel));
  gear.addEventListener('contextmenu', e => e.preventDefault());
  gear.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGate(); } });
})();
function openGate() {
  const a = 11 + Math.floor(Math.random() * 9), b = 4 + Math.floor(Math.random() * 6);
  let ans = '';
  parentEl.hidden = false;
  sheet.innerHTML = `<div class="gate"><h2>Для родителей</h2><p>Решите пример, чтобы открыть настройки</p>
    <div class="sum">${a} + ${b} = <span id="gAns">?</span></div>
    <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="del" aria-label="Стереть">⌫</button><button data-k="0">0</button><button data-k="ok" aria-label="Готово">✓</button></div>
    <div class="btns" style="justify-content:center"><button class="btn" id="gCancel">Отмена</button></div></div>`;
  const out = sheet.querySelector('#gAns');
  sheet.querySelector('.keys').addEventListener('click', e => {
    const k = e.target.closest('button')?.dataset.k; if (!k) return;
    if (k === 'del') ans = ans.slice(0, -1);
    else if (k === 'ok') {
      if (Number(ans) === a + b) { renderParent(); return; }
      ans = ''; out.textContent = '✗'; setTimeout(() => { out.textContent = '?'; }, 700); return;
    } else if (ans.length < 3) ans += k;
    out.textContent = ans || '?';
  });
  sheet.querySelector('#gCancel').addEventListener('click', closeParent);
}
function closeParent() { parentEl.hidden = true; sheet.innerHTML = ''; updateTitle(); Store.saveNow(); }
function renderParent() {
  const st = S.settings;
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(dayKey(d.getTime())); }
  const lockTxt = S.lockUntil > Date.now() ? new Date(S.lockUntil).toLocaleString('ru-RU', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  sheet.innerHTML = `
    <h2>Для родителей</h2>
    <p class="muted">${esc(S.name)}: ${STAGE_NAME[S.stage]}, дружба ${Math.floor(S.friendship)}. Сегодня в игре ${Math.round(S.played.ms / MIN)} мин.</p>
    <div class="row"><span>Имя питомца</span><input type="text" id="pName" maxlength="20" value="${esc(S.name)}"></div>
    <div class="row"><span>Цвет</span><div class="swatches">${Object.keys(PAL).map(c => `<button class="swatch" data-c="${c}" style="background:${PAL[c].css}" aria-pressed="${S.color === c}" aria-label="${COLOR_NAME[c]}" title="${COLOR_NAME[c]}"></button>`).join('')}</div></div>
    <div class="row"><span>Лимит времени в день</span><select id="pLimit">${[0, 10, 15, 20, 30, 45].map(v => `<option value="${v}" ${st.dailyLimitMin === v ? 'selected' : ''}>${v ? v + ' мин' : 'Выкл'}</option>`).join('')}</select></div>
    <div class="row"><span>Пауза после лимита</span><select id="pPause">${[['1h', '1 час'], ['3h', '3 часа'], ['tomorrow', 'До утра']].map(([v, t]) => `<option value="${v}" ${st.pause === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    ${lockTxt ? `<div class="row"><span>Пауза до ${esc(lockTxt)}</span><button class="btn" id="pUnlock">Снять паузу</button></div>` : ''}
    <div class="row"><span>Отбой</span><input type="time" id="pBed" step="900" value="${esc(st.bedtime)}"></div>
    <div class="row"><span>Подъём</span><input type="time" id="pWake" step="900" value="${esc(st.wakeup)}"></div>
    <div class="row"><span>Просится в туалет</span><input type="checkbox" id="pPotty" ${st.potty ? 'checked' : ''}></div>
    <div class="row"><span>Громкость</span><input type="range" id="pVol" min="0" max="100" value="${Math.round(st.volume * 100)}"></div>
    <div class="row"><span>Музыка</span><input type="range" id="pMus" min="0" max="100" value="${Math.round(st.music * 100)}"></div>
    <div class="row"><span>Вибрация</span><input type="checkbox" id="pVib" ${st.vibrate ? 'checked' : ''}></div>
    <h3>Последние 7 дней</h3>
    <table class="stats"><tr><th>День</th><th>Мин</th><th>Еда</th><th>Купание</th><th>Сон</th><th>Игры</th><th>Туалет</th></tr>
    ${days.map(d => { const s = S.stats[d] || {}; return `<tr><td>${d.slice(8)}.${d.slice(5, 7)}</td><td>${s.min || 0}</td><td>${s.feed || 0}</td><td>${s.bath || 0}</td><td>${s.sleep || 0}</td><td>${s.play || 0}</td><td>${s.potty || 0}</td></tr>`; }).join('')}</table>
    <h3>Перенос на другое устройство</h3>
    <p class="muted">Питомец живёт ${K.app ? 'в этом приложении' : 'в этом браузере'}. Чтобы перенести его, нажмите «Показать код», отправьте код себе (например, в мессенджер) и на другом устройстве нажмите «Ввести код». Питомец там заменится этим.</p>
    <div class="btns"><button class="btn" id="pExport">Показать код</button><button class="btn" id="pImport">Ввести код</button></div>
    <div id="pXfer"></div>
    <h3>Начать заново</h3>
    <div class="btns"><button class="btn danger" id="pReset">Начать заново…</button></div>
    <div id="pResetBox"></div>
    ${K.app ? '' : `<div class="row"><span>Отладка: числа шкал и перемотка времени</span><input type="checkbox" id="pDebug" ${dbgOn ? 'checked' : ''}></div>`}
    <div class="btns"><button class="btn main" id="pClose">Готово</button></div>`;
  const $ = id => sheet.querySelector('#' + id);
  $('pName').addEventListener('input', e => { S.name = e.target.value.trim().slice(0, 20) || 'Пуфик'; Store.dirty(); });
  sheet.querySelectorAll('.swatch').forEach(b => b.addEventListener('click', () => {
    S.color = b.dataset.c; sheet.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', String(x === b))); Store.dirty();
  }));
  $('pLimit').addEventListener('change', e => { st.dailyLimitMin = Number(e.target.value); Store.dirty(); });
  $('pPause').addEventListener('change', e => { st.pause = e.target.value; Store.dirty(); });
  $('pUnlock')?.addEventListener('click', () => { S.lockUntil = 0; S.played.ms = 0; if (G.scene === 'limit') setScene('living'); Store.saveNow(); renderParent(); });
  const timeOk = v => /^\d\d:\d\d$/.test(v);
  $('pBed').addEventListener('change', e => { if (timeOk(e.target.value)) { st.bedtime = e.target.value; Store.dirty(); } });
  $('pWake').addEventListener('change', e => { if (timeOk(e.target.value)) { st.wakeup = e.target.value; Store.dirty(); } });
  $('pPotty').addEventListener('change', e => { st.potty = e.target.checked; if (!st.potty) { G.potty = null; S.pottyAt = null; } Store.dirty(); });
  $('pVol').addEventListener('input', e => { st.volume = Number(e.target.value) / 100; applySettings(); Store.dirty(); });
  $('pMus').addEventListener('input', e => { st.music = Number(e.target.value) / 100; applySettings(); Store.dirty(); });
  $('pVib').addEventListener('change', e => { st.vibrate = e.target.checked; applySettings(); Store.dirty(); });
  $('pExport').addEventListener('click', () => {
    Store.saveNow();
    const code = Store.exportCode();
    $('pXfer').innerHTML = `<p class="muted">Код питомца:</p><textarea readonly id="pCode">${esc(code)}</textarea><div class="btns"><button class="btn" id="pCopy">Скопировать</button></div>`;
    $('pCopy').addEventListener('click', async () => {
      const ta = $('pCode'); ta.select();
      try { await navigator.clipboard.writeText(code); $('pCopy').textContent = 'Скопировано'; } catch (e) { try { document.execCommand('copy'); $('pCopy').textContent = 'Скопировано'; } catch (e2) {} }
    });
  });
  $('pImport').addEventListener('click', () => {
    $('pXfer').innerHTML = `<p class="muted">Вставьте код с другого устройства:</p><textarea id="pIn"></textarea><div class="btns"><button class="btn main" id="pLoad">Загрузить питомца</button></div><p class="muted" id="pMsg"></p>`;
    $('pLoad').addEventListener('click', () => {
      const d = Store.importCode($('pIn').value);
      if (!d) { $('pMsg').textContent = 'Код не подошёл. Проверьте, что он скопирован целиком.'; return; }
      S = d; resetRuntime(); Store.saveNow(); renderParent();
    });
  });
  $('pReset').addEventListener('click', () => {
    $('pResetBox').innerHTML = `<p class="muted">Пуфик, его рост, вещи и статистика удалятся. Настройки тоже сбросятся.</p><div class="btns"><button class="btn danger" id="pWipe">Удалить Пуфика</button></div>`;
    $('pWipe').addEventListener('click', () => { Store.wipe(); S = Store.defaults(); resetRuntime(); Store.saveNow(); renderParent(); });
  });
  $('pDebug')?.addEventListener('change', e => { setDebug(e.target.checked); });
  $('pClose').addEventListener('click', closeParent);
}
function resetRuntime() {
  G.wish = null; G.potty = null; G.wash = null; G.box = null; G.reveal = null; G.pendingStage = null; G.k = null; G.b = null; G.mg = null;
  pet.act = null; pet.foam = []; G.greet = false; G.goodbye = false; G.lastTick = Date.now(); S.lastSeen = Date.now();
  checkStage(); applySettings(); updateTitle();
  G.scene = 'living';
}

// ---------- debug ----------
const dbgEl = document.getElementById('debug');
let dbgOn = false, dbgTimer = null;
function setDebug(on) {
  dbgOn = on; dbgEl.hidden = !on;
  clearInterval(dbgTimer);
  if (!on) return;
  dbgEl.innerHTML = `<span id="dTxt"></span><button data-a="h">+1 ч</button><button data-a="d">+1 день</button><button data-a="n">ночь: авто</button><button data-a="f">+50 ❤</button><button data-a="w">желание</button><button data-a="g">подарок</button>`;
  dbgEl.onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'h' || a === 'd') { const span = a === 'h' ? HOUR : 24 * HOUR; simulateAway(Date.now() - span, Date.now()); }
    if (a === 'n') { DBG.night = DBG.night === null ? true : DBG.night ? false : null; e.target.textContent = 'ночь: ' + (DBG.night === null ? 'авто' : DBG.night ? 'да' : 'нет'); }
    if (a === 'f') { S.friendshipToday.points = 0; addFriend(50); }
    if (a === 'w') { G.wish = null; G.nextWishAt = 1; }
    if (a === 'g') { S.pendingGifts++; }
    Store.dirty(); upd();
  };
  const upd = () => {
    const n = S.needs;
    dbgEl.querySelector('#dTxt').textContent = `🍎${n.food.toFixed(1)} 🌙${n.energy.toFixed(1)} 💧${n.clean.toFixed(1)} ⚽${n.fun.toFixed(1)} ❤${Math.floor(S.friendship)}(${S.friendshipToday.points}/60) ${S.stage} ${phase()}${S.asleep ? ' сон' : ''} ${mood()}`;
  };
  upd(); dbgTimer = setInterval(upd, 500);
}

// ---------- boot ----------
(() => {
  const gap = Date.now() - S.lastSeen;
  if (gap > 0) simulateAway(S.lastSeen, Date.now());
  G.greet = gap > 12 * HOUR && S.stage !== 'egg';
  S.lastSeen = Date.now(); G.lastTick = Date.now();
  if (S.stage !== 'egg' && isNight()) S.asleep = true;
  checkStage();
  applySettings(); updateTitle();
  K.init();
  setScene(S.stage !== 'egg' && isNight() ? 'bed' : 'living');
  const save = () => { S.lastSeen = Date.now(); Store.saveNow(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  addEventListener('pagehide', save);
  // the Android app's hooks (on the web too); each is safe at any moment and never throws
  window.pufikApp = {
    // true: handled here (the parent menu closed) or ignored on purpose while a child plays (the back gesture is easy
    // to hit by accident); false on the start card, where the app may go to the background
    back() { try { if (!parentEl.hidden) { closeParent(); return true; } return !!K.playing; } catch (e) { return true; } },
    pause() { try { save(); } catch (e) {} try { K.pause(); } catch (e) {} },
    resume() { try { K.resume(); } catch (e) {} },
  };
  if (/debug/.test(location.hash)) setDebug(true);
  Store.saveNow();
})();
</script>
